[general]
static=yes
writeprotect=no

[nx-inbound]
; Initial safe landing context for calls delivered by SharkPBX.
; We intentionally do not hard-code external forwarding here until an
; outbound trunk is configured and NX Voice routing/CC checks are enabled.
exten => _X.,1,NoOp(NX Voice inbound call DID=${EXTEN} CID=${CALLERID(num)})
 same => n,Set(NX_PROVIDER=sharkpbx)
 same => n,Set(NX_CALL_START=${EPOCH})
 same => n,Answer()
 same => n,Playback(beep)
 same => n,Wait(1)
 same => n,Hangup()

; Provider may deliver the SIP account/extension instead of the public TFN.
exten => _25XX,1,Goto(nx-inbound,${EXTEN},1)
